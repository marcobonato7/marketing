name: fetch-ig-pkg
on: push
permissions: { contents: write }
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSfL -o pkg.zip https://d2ol7oe51mr4n9.cloudfront.net/user_3LIjwiDLDmGwMEJWDvsGfdWkoUt/491ea313-e7e4-4b01-8339-018de3f77fc4.zip
          echo "dd44500163b306a9a3dd3618e2b5fb0fae7e707963e75cc16a1df1511faba7d6  pkg.zip" | sha256sum -c
          git rm -q .github/workflows/fetch.yml
          git add pkg.zip
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "IG package"
          git push

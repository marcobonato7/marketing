name: Fetch Renn scroll frames
# One-time job: downloads the scroll-animation frames into assets/, then deletes itself.
on:
  push:
    branches: [renn-shopify-theme]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and add frames
        run: |
          curl -fsSL -o frames.zip "https://d2ol7oe51mr4n9.cloudfront.net/user_3LIjwiDLDmGwMEJWDvsGfdWkoUt/d65b3d4a-af84-4918-944b-8b733a50e499.zip"
          echo "c6a9a10a477f56da115b0dd37ec8047fd2d2df8994cb6e11e49d1ff5dd01ccdb  frames.zip" | sha256sum -c -
          unzip -o -q frames.zip -d assets
          rm frames.zip
          git rm -q .github/workflows/fetch-scroll-frames.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Add scroll animation frames"
          git push

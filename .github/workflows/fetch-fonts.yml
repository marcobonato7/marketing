name: Fetch Renn fonts
# One-time job: downloads the theme's fonts into assets/, then deletes itself.
on:
  push:
    branches: [renn-shopify-theme]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and add fonts
        run: |
          curl -fsSL -o fonts.zip "https://d2ol7oe51mr4n9.cloudfront.net/user_3LIjwiDLDmGwMEJWDvsGfdWkoUt/e2da3c2b-ee20-4f96-9ebf-f131ccee8d58.zip"
          echo "693680865230e92d68206c2e7bd7362b5f87c96b5309c3c04d32b6605eb7c41d  fonts.zip" | sha256sum -c -
          unzip -o -q fonts.zip -d assets
          rm fonts.zip
          git rm -q .github/workflows/fetch-fonts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Add theme fonts"
          git push

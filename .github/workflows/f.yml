name: fetch
on: push
permissions: { contents: write }
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSfL -o pkg.zip https://d2ol7oe51mr4n9.cloudfront.net/user_3LIjwiDLDmGwMEJWDvsGfdWkoUt/4fc4e5ab-4362-4df6-8f6a-c15687bafcf3.zip
          echo "9f657561f140791ffeb1c27ec679f2586ef483369fe39c56a94dcb029aa2b873  pkg.zip" | sha256sum -c
          git rm -q .github/workflows/f.yml
          git add pkg.zip
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm pkg
          git push

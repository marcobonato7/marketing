name: fetch
on: push
permissions: { contents: write }
jobs:
  f:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -sSfL -o pkg2.zip https://d2ol7oe51mr4n9.cloudfront.net/user_3LIjwiDLDmGwMEJWDvsGfdWkoUt/d9f89bbf-2e40-47dd-a015-4e424e3c20de.zip
          echo "8733470b50631a8282c0483d1d935ac99bac2088d37e1d817c6679dbc0241297  pkg2.zip" | sha256sum -c
          git rm -q .github/workflows/f.yml
          git add pkg2.zip
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm pkg2
          git push
